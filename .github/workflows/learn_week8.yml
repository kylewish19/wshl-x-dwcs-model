name: Learn from DWCS Week 8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/learn_from_week8.py"
      - "data/current/week8_results.csv"
      - "data/current/week8_model_features.csv"
      - "data/current/week8_current_records.csv"
      - "data/current/week8_fighter_snapshots.csv"
      - "data/current/week7_results.csv"
      - "src/learn_from_week7.py"
      - ".github/workflows/learn_week8.yml"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn joblib duckdb kagglehub
      - name: Refit and evaluate Week 8 learning candidates
        run: python src/learn_from_week8.py
      - name: Commit Week 8 learning artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/week8_learning_summary.json
          git add reports/winner_v0_6_week8_*.csv
          git add models/dwcs_w_v0_6_week8_logistic.joblib
          git add models/dwcs_w_v0_6_boosting_shadow.joblib
          git add models/dwcs_m_v0_3_week8_refit.joblib
          git add models/dwcs_m_v0_4_finish_gate_logistic.joblib
          git add models/dwcs_m_v0_4_finish_route_logistic.joblib
          git add models/dwcs_d_pair_hazard_*_v0_4.joblib
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Learn from DWCS Week 8 results [skip ci]"
            git pull --rebase origin main
            git push
          fi
