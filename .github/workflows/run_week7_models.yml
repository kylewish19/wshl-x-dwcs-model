name: Run DWCS Week 7 Models

on:
  push:
    paths:
      - 'src/run_week7_models.py'
      - 'src/prepare_week7_ext_features.py'
      - '.github/workflows/run_week7_models.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn joblib duckdb kagglehub
      - name: Rebuild Week 7 secondary feature schema
        run: python src/prepare_week7_ext_features.py
      - name: Run four-model Week 7 card
        run: python src/run_week7_models.py
      - name: Commit pre-odds lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/week7_secondary_model_features.csv official_picks/week7_preodds_model_lock.csv reports/week7_preodds_model_lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Lock DWCS Week 7 pre-odds model card"
          git push
