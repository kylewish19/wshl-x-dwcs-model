name: Build DWCS Winner Confidence Gate v0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/build_winner_confidence_gate_v0_1.py"
      - ".github/workflows/build_winner_confidence_gate_v0_1.yml"
      - "reports/winner_v0_7_nested_validation_predictions.csv"
      - "diagnostics/week9_v0_7_modular_rerun.csv"
      - "official_picks/week9_preodds_model_lock.csv"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn joblib
      - name: Build confidence gate
        run: python src/build_winner_confidence_gate_v0_1.py
      - name: Commit generated confidence artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/week9_winner_confidence_gate_v0_1.csv
          git add reports/winner_confidence_gate_v0_1_validation.json
          git add reports/winner_confidence_gate_v0_1_nested_predictions.csv
          git add models/dwcs_w_confidence_gate_v0_1.joblib
          git add models/model_registry.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build DWCS winner confidence gate v0.1 [skip ci]"
            git pull --rebase origin main
            git push
          fi
