name: Build DWCS Winner v0.8 Evidence-Calibrated Challenger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/build_winner_v0_8_calibrated.py"
      - ".github/workflows/build_winner_v0_8_calibrated.yml"
      - "reports/winner_v0_7_nested_validation_predictions.csv"
      - "diagnostics/week9_v0_7_modular_rerun.csv"
      - "official_picks/week9_preodds_model_lock.csv"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn joblib
      - name: Build evidence-calibrated challenger
        run: python src/build_winner_v0_8_calibrated.py
      - name: Commit generated calibration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/week9_v0_8_evidence_calibrated_rerun.csv
          git add reports/winner_v0_8_evidence_calibrated_validation.json
          git add reports/winner_v0_8_nested_validation_predictions.csv
          git add models/dwcs_w_v0_8_evidence_calibrated_challenger.joblib
          git add models/model_registry.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build DWCS winner v0.8 evidence calibrator [skip ci]"
            git pull --rebase origin main
            git push
          fi
