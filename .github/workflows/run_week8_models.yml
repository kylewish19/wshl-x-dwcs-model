name: Run DWCS Week 8 models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/current/week8_matchups.csv"
      - "data/current/week8_current_records.csv"
      - "data/current/week8_postcutoff_fights.csv"
      - "data/current/week8_tape_features.csv"
      - "src/prepare_week8_snapshots.py"
      - "src/prepare_week8_ext_features.py"
      - "src/run_week8_models.py"
      - ".github/workflows/run_week8_models.yml"

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn joblib duckdb kagglehub

      - name: Download MMA Global Database
        run: |
          mkdir -p .cache/mmaglobal
          curl -L --fail --retry 3 "https://www.kaggle.com/api/v1/datasets/download/leandroiber/mmastats" -o /tmp/mmastats.zip
          unzip -q /tmp/mmastats.zip -d .cache/mmaglobal
          find .cache/mmaglobal -type f -name '*.duckdb' -print

      - name: Build Week 8 fighter snapshots
        run: |
          DB="$(find .cache/mmaglobal -type f -name '*.duckdb' | head -1)"
          test -n "$DB"
          python src/prepare_week8_snapshots.py --database "$DB"
          python src/build_current_features.py             --snapshots data/current/week8_fighter_snapshots.csv             --matchups data/current/week8_matchups.csv             --out data/current/week8_model_features.csv

      - name: Build Week 8 secondary feature schema
        run: python src/prepare_week8_ext_features.py

      - name: Run four-model Week 8 card
        run: python src/run_week8_models.py

      - name: Commit Week 8 pre-odds lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/week8_fighter_snapshots.csv
          git add data/current/week8_model_features.csv
          git add data/current/week8_secondary_model_features.csv
          git add reports/week8_snapshot_coverage.json
          git add reports/week8_preodds_model_lock.json
          git add official_picks/week8_preodds_model_lock.csv
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Lock DWCS Week 8 pre-odds model card [skip ci]"
            git pull --rebase origin main
            git push
          fi
