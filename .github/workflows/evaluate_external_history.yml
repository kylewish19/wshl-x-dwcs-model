name: Evaluate DWCS external career layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/evaluate_external_history.py"
      - ".github/workflows/evaluate_external_history.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt kagglehub
      - name: Download CC0 external history and evaluate
        run: |
          python - <<'PY'
          import kagglehub, pathlib, subprocess
          p = pathlib.Path(kagglehub.dataset_download("binduvr/pro-mma-fights"))
          f = next(p.rglob("pro_mma_fights.csv"))
          subprocess.run(["python", "src/evaluate_external_history.py", str(f)], check=True)
          PY
      - name: Commit audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/external_history_walk_forward_* data/processed/dwcs_external_history_audit_matrix.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Evaluate external career/opponent-strength layer [skip ci]"
            git push
          fi
