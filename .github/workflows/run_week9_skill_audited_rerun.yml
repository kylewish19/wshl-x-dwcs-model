name: Run DWCS Week 9 Skill-Audited Rerun

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/run_week9_skill_audited_rerun.py"
      - ".github/workflows/run_week9_skill_audited_rerun.yml"
      - "reports/week9_preodds_model_lock.json"
      - "diagnostics/week9_v0_7_modular_rerun.csv"
      - "official_picks/week9_preodds_model_lock.csv"

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run skill-audited Week 9 card
        run: python src/run_week9_skill_audited_rerun.py
      - name: Commit audited rerun
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/week9_skill_audited_rerun.csv
          git add reports/week9_skill_audited_rerun.json
          git add models/model_registry.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add DWCS Week 9 skill-audited rerun [skip ci]"
            git pull --rebase origin main
            git push
          fi
