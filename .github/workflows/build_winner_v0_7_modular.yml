name: Build DWCS Winner v0.7 Modular Challenger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/build_winner_v0_7_modular.py"
      - ".github/workflows/build_winner_v0_7_modular.yml"
      - "data/current/week7_model_features.csv"
      - "data/current/week7_results.csv"
      - "data/current/week8_model_features.csv"
      - "data/current/week8_results.csv"
      - "data/current/week9_model_features.csv"
      - "data/current/week9_fighter_snapshots.csv"
      - "data/current/week9_tape_features.csv"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn joblib
      - name: Build and validate modular winner challenger
        run: python src/build_winner_v0_7_modular.py
      - name: Commit generated model and Week 9 development rerun
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/week9_v0_7_modular_rerun.csv
          git add reports/winner_v0_7_modular_validation.json
          git add reports/winner_v0_7_nested_validation_predictions.csv
          git add models/dwcs_w_v0_7_modular_challenger.joblib
          git add models/model_registry.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build DWCS winner v0.7 modular challenger [skip ci]"
            git pull --rebase origin main
            git push
          fi
